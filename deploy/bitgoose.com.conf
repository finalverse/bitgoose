# ---------------------------------------------------------------------------
# BitGoose — nginx vhost.
#
# Installed alongside the existing finalverse.com and nycapital.net vhosts;
# `server_name` scoping means neither is affected.
#
# This is the pre-TLS form. `certbot --nginx -d bitgoose.com -d www.bitgoose.com`
# rewrites it to add the 443 block and the redirect once DNS points here.
# ---------------------------------------------------------------------------

upstream bitgoose_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name bitgoose.com www.bitgoose.com;

    access_log /var/log/nginx/bitgoose.access.log;
    error_log  /var/log/nginx/bitgoose.error.log;

    # Certbot's HTTP-01 challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # Hashed WASM/CSS bundles are content-addressed by cargo-leptos, so they
    # can be cached hard. Everything else is news and must not be.
    location /pkg/ {
        proxy_pass http://bitgoose_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://bitgoose_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # The newsroom pipeline can hold a request open while a top-tier model
        # reasons over a large claim set; the default 60s would cut it off.
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;

        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml;

    # Conservative headers. No CSP yet — Leptos injects inline hydration
    # scripts, so a correct policy needs nonces wiring through the shell first;
    # shipping a broken CSP would be worse than shipping none.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 2m;
}
