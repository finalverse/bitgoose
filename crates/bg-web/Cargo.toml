[package]
name = "bg-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "BitGoose website: Leptos SSR + hydration."

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "bg-web"
path = "src/main.rs"
required-features = ["ssr"]

[dependencies]
# WASM-safe only. Everything native is optional and gated behind `ssr`,
# so it never reaches the hydrate build.
bg-core.workspace = true
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
serde.workspace = true
chrono.workspace = true
rust_decimal.workspace = true
serde_json.workspace = true

console_error_panic_hook = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
web-sys.workspace = true

axum = { workspace = true, optional = true }
leptos_axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
bg-db = { workspace = true, optional = true }
bg-api = { workspace = true, optional = true }
dotenvy = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
pulldown-cmark = { workspace = true, optional = true }
resvg = { workspace = true, optional = true }

[features]
default = []
hydrate = ["leptos/hydrate", "dep:console_error_panic_hook", "dep:wasm-bindgen"]
ssr = [
    "dep:axum", "dep:leptos_axum", "dep:tokio", "dep:tower-http",
    "dep:bg-db", "dep:bg-api",
    "dep:dotenvy", "dep:tracing", "dep:tracing-subscriber", "dep:pulldown-cmark",
    # Share-card rendering is server-only. An image rasteriser has no business
    # in the hydrate bundle, and bg-core's wasm32 check would not catch it here.
    "dep:resvg",
    "leptos/ssr", "leptos_meta/ssr", "leptos_router/ssr",
]
