<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="BitGoose">
  <!-- Ink field, so the mark holds its own on a light or a dark tab strip. -->
  <rect width="64" height="64" rx="14" fill="#0B0D10"/>
  <!-- A goose head in profile: long neck rising from the lower left, beak to
       the right. Drawn as one filled path so it stays legible at 16px, where
       strokes and interior detail turn to mud. -->
  <path fill="#F5B301" d="
    M22 56
    C 20 44, 21 34, 26 27
    C 30 21, 36 18, 41 19
    C 47 20, 52 25, 52 32
    L 62 34
    L 51 41
    C 47 45, 41 46, 38 45
    C 34 44, 31 41, 30 37
    C 29 42, 29 49, 30 56
    Z"/>
  <!-- Eye punched through to the ink field rather than painted, so it reads at
       any size without a second colour. -->
  <circle cx="42" cy="28" r="2.6" fill="#0B0D10"/>
</svg>
